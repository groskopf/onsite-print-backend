services:
  backend:
    build: .
    image: ghcr.io/groskopf/onsite-print-backend:${IMAGE_TAG:?Set IMAGE_TAG in .env}
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: onsite_print
      DB_USER: onsite_print
      DB_PASSWORD_FILE: /run/secrets/postgres_password
      NAMETAGS_DIR: /var/lib/onsite-print/nametags
      IMAGES_DIR: /var/lib/onsite-print/images
      SHEETS_DIR: /var/lib/onsite-print/sheets
    volumes:
      - nametags:/var/lib/onsite-print/nametags
      - images:/var/lib/onsite-print/images
      - sheets:/var/lib/onsite-print/sheets
    secrets:
      - postgres_password
    restart: unless-stopped

volumes:
  nametags:
  images:
  sheets:

secrets:
  postgres_password:
    file: ../onsite-print-database/secrets/postgres_password
