[project]
name = "onsite-print-backend"
version = "0.0.1"
description = "REST API for onsite-print"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary,pool]>=3.2",
    "reportlab>=4.2",
    "pillow>=11",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = [
    "black>=24.10",
    "flake8>=7",
    "httpx>=0.27",
    "isort>=5",
    "mypy>=1.13",
    "pre-commit>=4",
    "pytest>=8",
    "pytest-cov>=6",
    "pypdf>=5",
    "ruff>=0.8",
    "types-reportlab>=4.2",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.black]
line-length = 120

[tool.isort]
line_length = 120

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
